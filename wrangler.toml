name = "tbt-wealth-tracker"
pages_build_output_dir = "public"
compatibility_date = "2026-05-29"

# ─── Cron Triggers ──────────────────────────────────────────────────────────────
# NOTE: Cron triggers for Pages Functions must be set via Cloudflare Dashboard:
# Pages → Project → Settings → Functions → Cron Triggers
# Daily Backup:  0 17 * * *   (00:00 ICT = 17:00 UTC)
# Daily Report:  0 13 * * *   (20:00 ICT = 13:00 UTC)

# ─── D1 Database (TBT Shop - Primary Storage) ──────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "tbt-wealth-db"
database_id   = "cce1b22a-93ae-453d-9b73-fd0d72c98fc2"

# ─── KV (TBT Shop - Session + File Fallback) ────────────────────────────────────
[[kv_namespaces]]
binding = "KV_STORE"
id      = "b49c7c1ec80b478b8bcfb24f73fb3c3f"

# ─── R2 (TBT Shop - Image Storage) ──────────────────────────────────────────────
[[r2_buckets]]
binding     = "IMAGES"
bucket_name = "tbt-wealth-images"



